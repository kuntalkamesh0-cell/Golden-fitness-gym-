name: Build Golden Fitness Gym APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract Latest Source
        run: |
          unzip "Dalni zip golden-fitness-gym lllllllllll.zip" -d source

      - name: Find Project Folder
        run: |
          PROJECT_DIR=$(dirname "$(find source -name package.json -not -path '*/node_modules/*' -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_DIR"

      - name: Set App Name
        run: |
          sed -i 's/Fitness Club House/Golden Fitness Gym/g' "$PROJECT_DIR/capacitor.config.ts"
          sed -i 's/Fitness Club House/Golden Fitness Gym/g' "$PROJECT_DIR/android/app/src/main/res/values/strings.xml"

      - name: Install Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --legacy-peer-deps

      - name: Build Web App
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Sync Android
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Golden-Fitness-Gym-APK
          path: "${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk"
